<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Italy – Commandes</title>
<link rel="manifest" href="/admin.webmanifest">
<meta name="theme-color" content="#C8102E">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Italy">
<style>
  :root { --chart-main:#C8102E; --series-1:#2a78d6; --series-2:#eb6834; --grid:#e9e3d8; --good:#2e7d32; --warn:#b45309;
    --bg:#faf6f0; --card:#fff; --ink:#222; --muted:#777; --red:#c8102e; --green:#2e7d32; --amber:#e08a00; --line:#e6dfd3; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--red); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; flex:1; }
  nav button { background:transparent; color:#fff; border:1px solid #fff9; padding:8px 14px; border-radius:8px; font-size:16px; }
  nav button.on { background:#fff; color:var(--red); }
  main { padding:16px; max-width:900px; margin:auto; }
  h3 { margin:24px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .badge { padding:2px 8px; border-radius:99px; font-size:13px; color:#fff; }
  .new{background:var(--red)} .preparing{background:var(--amber)} .ready{background:var(--green)} .done{background:#999} .cancelled{background:#555}
  .tag { background:#fff3cd; border:1px solid #f0d98a; border-radius:6px; padding:1px 6px; font-size:13px; }
  .time { font-size:22px; font-weight:700; }
  button.act { padding:10px 14px; border:0; border-radius:8px; font-size:16px; background:var(--ink); color:#fff; cursor:pointer; }
  button.act.green { background:var(--green); } button.act.red { background:#999; } button.act.sm { padding:6px 10px; font-size:14px; }
  ul { margin:4px 0 8px; padding-left:20px; }
  li small { color:var(--muted); }
  input, select, textarea { padding:8px; font-size:16px; border:1px solid var(--line); border-radius:8px; font-family:inherit; }
  label.f { display:block; font-size:13px; color:var(--muted); margin-top:8px; }
  label.f input, label.f select, label.f textarea { display:block; width:100%; color:var(--ink); }
  .muted { color:var(--muted); font-size:14px; }
  .off { opacity:.55; }
  details > summary { cursor:pointer; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  img.thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; background:#eee; }
  #login { max-width:340px; margin:60px auto; }
  .big { font-size:18px; padding:14px 18px; }
  .saved { color:var(--green); font-size:14px; }

  /* Navigation : défile horizontalement sur petit écran plutôt que de déborder */
  nav { display:flex; gap:6px; overflow-x:auto; max-width:100%; }
  nav button { white-space:nowrap; }
  /* Stats */
  h3 { font-size:17px; }
  .card h3 { margin:0 0 6px; }
  .chip { padding:8px 12px; border:1px solid var(--line); border-radius:99px; background:#fff; font-size:15px; cursor:pointer; color:var(--ink); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .today { background:#fff8e6; border-color:#f0d98a; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .tlabel { color:var(--muted); font-size:14px; }
  .tvalue { font-size:30px; font-weight:700; letter-spacing:-.5px; margin:2px 0; }
  .tsub { font-size:13px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
  svg.chart { width:100%; height:auto; display:block; }
  .axis { font-size:11px; fill:#6b6b6b; }
  .peak { font-size:12px; font-weight:700; fill:var(--ink); }
  .bars { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .barrow { display:grid; grid-template-columns:minmax(110px,32%) 1fr 54px; align-items:center; gap:10px; }
  .barlabel { font-size:15px; }
  .bartrack { height:14px; }
  .barfill { height:14px; background:var(--chart-main); border-radius:0 4px 4px 0; min-width:2px; }
  .barvalue { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
  .split { display:flex; gap:2px; height:22px; margin:10px 0 8px; }
  .split > div { min-width:3px; }
  .split > div:first-child { border-radius:4px 0 0 4px; } .split > div:last-child { border-radius:0 4px 4px 0; } .split > div:only-child { border-radius:4px; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:14px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; }
  .delta b { font-size:12px; }
  .big { font-size:24px; }
  .review { border-top:1px solid var(--line); padding:8px 0; font-size:15px; }
  .tbl { border-collapse:collapse; width:100%; font-size:14px; margin-top:8px; }
  .tbl th { text-align:left; color:var(--muted); font-weight:600; }
  .tbl td, .tbl th { padding:5px 8px 5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  details summary { outline:none; }
  details.client > summary { cursor:pointer; }
  details.client .detail { margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
  textarea { width:100%; }
  #tip { position:fixed; z-index:50; background:#222; color:#fff; padding:6px 10px; border-radius:8px; font-size:13px; pointer-events:none; max-width:280px; }
  .stripe { margin-bottom:12px; }
  @media (max-width: 560px) {
    .tiles { grid-template-columns:repeat(2,1fr); gap:8px; }
    .tile { padding:10px; } .tvalue { font-size:22px; } .tsub { font-size:12px; }
    main { padding:12px; } .barrow { grid-template-columns:minmax(90px,38%) 1fr 44px; gap:8px; }
  }
</style>
</head>
<body>
<header>
  <h1>🍕 Little Italy</h1>
  <nav id="nav" hidden>
    <button data-tab="orders" class="on">Commandes</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="clients">Clients</button>
    <button data-tab="menu">Carte</button>
    <button data-tab="settings">Réglages</button>
  </nav>
</header>
<main>
  <div id="login" class="card" hidden>
    <p>Code d'accès Olivier</p>
    <div class="row"><input id="token" type="password" class="grow" autocomplete="current-password"><button class="act" id="go">Entrer</button></div>
    <p class="muted" id="loginErr"></p>
  </div>
  <section id="orders" hidden></section>
  <section id="stats" hidden></section>
  <section id="clients" hidden></section>
  <section id="menu" hidden></section>
  <section id="settings" hidden></section>
</main>
<script src="/admin-stats.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const euro = (c) => (c / 100).toFixed(2).replace('.', ',') + ' €';
const toCents = (v) => Math.round(parseFloat(String(v).replace(',', '.')) * 100);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS_LABEL = { new:'Nouvelle', preparing:'En préparation', ready:'Prête', done:'Retirée', cancelled:'Annulée' };
const KINDS = { pizza:'Pizza', boisson:'Boisson', dessert:'Dessert', autre:'Autre' };
let token = sessionStorage.getItem('adminToken') || '';
let tab = 'orders', knownIds = new Set(), first = true, timer;

async function api(path, opts = {}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401 || res.status === 503) throw Object.assign(new Error('auth'), { auth: true, status: res.status });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
const safe = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (e.auth) refresh(); else alert(e.message); } };

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); o.frequency.value = 880; o.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.4);
  } catch {}
}

/* ---------- Commandes ---------- */
function orderCard(o) {
  const next = { new:['preparing','Préparer','act'], preparing:['ready','Prête ✓','act green'], ready:['done','Retirée','act'] }[o.status];
  const pay = o.payment_status === 'paid' ? '✅ Payée en ligne' : '💶 À encaisser au retrait';
  return `<div class="card">
    <div class="row"><span class="time">${esc(o.pickup_time)}</span>
      <span class="grow"><b>#${o.number}</b> ${esc(o.customer_name)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></span>
      ${o.reward_used ? '<span class="tag">🎁 pizza offerte</span>' : ''}
      <span class="badge ${o.status}">${STATUS_LABEL[o.status]}</span></div>
    <ul>${o.items.map((i) => `<li><b>${i.quantity} × ${esc(i.name)}</b>${i.details ? `<br><small>${esc(i.details)}</small>` : ''}</li>`).join('')}</ul>
    ${o.note ? `<p class="muted">📝 ${esc(o.note)}</p>` : ''}
    <div class="row"><b class="grow">${euro(o.total_cents)}${o.discount_cents ? ` (dont ${euro(o.discount_cents)} offerts)` : ''} — ${pay}</b>
      ${next ? `<button class="${next[2]}" data-id="${o.id}" data-status="${next[0]}">${next[1]}</button>` : ''}
      ${['new','preparing'].includes(o.status) ? `<button class="act red" data-id="${o.id}" data-status="cancelled">Annuler</button>` : ''}
    </div></div>`;
}
let todayStrip = '', todayAt = 0;
async function loadOrders() {
  if (Date.now() - todayAt > 60000) {
    todayAt = Date.now();
    api('/stats?days=1').then((st) => {
      const t = st.today;
      todayStrip = `<div class="card today stripe"><b>Aujourd'hui</b> — ${t.orders} commande${t.orders > 1 ? 's' : ''} · ${euro(t.revenue_cents)} · ${t.pizzas} pizza${t.pizzas > 1 ? 's' : ''}</div>`;
      const el = document.querySelector('#orders .stripe'); if (el) el.outerHTML = todayStrip;
    }).catch(() => {});
  }
  const { orders } = await api('/orders');
  const fresh = orders.filter((o) => o.status === 'new' && !knownIds.has(o.id));
  if (fresh.length && !first) beep();
  orders.forEach((o) => knownIds.add(o.id)); first = false;
  const active = orders.filter((o) => ['new','preparing','ready'].includes(o.status));
  const past = orders.filter((o) => !active.includes(o));
  $('#orders').innerHTML = (todayStrip || '<div class="stripe"></div>') +
    (active.length ? active.map(orderCard).join('') : '<p class="muted">Aucune commande en cours.</p>') +
    (past.length ? `<h3>Terminées aujourd'hui</h3>` + past.map(orderCard).join('') : '');
}

/* ---------- Réglages ---------- */
async function loadSettings() {
  const [s, { items }] = await Promise.all([api('/settings'), api('/menu')]);
  const pizzas = items.filter((i) => i.kind === 'pizza' && i.available);
  $('#settings').innerHTML = `
    <div class="card">
      <b>⭐ Pizza de la semaine</b>
      <div class="muted">Mise en avant en haut de la carte de l'appli, avec un prix promo si vous le souhaitez.</div>
      <label class="f">Pizza
        <select id="fItem"><option value="">— Aucune —</option>${pizzas.map((i) => `<option value="${i.id}" ${i.id === s.featuredItemId ? 'selected' : ''}>${esc(i.name)} (${euro(i.price_cents)})</option>`).join('')}</select></label>
      <div class="row">
        <label class="f grow">Prix promo € (laisser vide = prix normal)<input id="fPrice" inputmode="decimal" value="${s.featuredPriceCents === null ? '' : (s.featuredPriceCents / 100).toFixed(2).replace('.', ',')}"></label>
        <label class="f grow">Jusqu'au (inclus, facultatif)<input id="fUntil" type="date" value="${s.featuredUntil ?? ''}"></label></div>
      <label class="f">Petit texte (facultatif)<input id="fNote" maxlength="100" value="${esc(s.featuredNote)}" placeholder="Ex : Nouvelle recette du chef !"></label>
      <p class="row"><button class="act" id="fSave">Enregistrer</button><span class="saved" id="fOk"></span></p>
    </div>
    <div class="card">
      <label class="f">Plus rien à afficher ? Choisissez « Aucune » ci-dessus puis Enregistrer. Une pizza de la semaine s'arrête aussi toute seule après sa date de fin.</label>
    </div>
    ` + `
    <div class="card">
      <div class="row"><div class="grow"><b>Prise de commandes</b><div class="muted">Fermez en un clic quand vous n'en pouvez plus ou en cas de fermeture.</div></div>
      <button class="act big ${s.ordersOpen ? 'green' : ''}" id="sOpen">${s.ordersOpen ? '🟢 Ouvert' : '🔴 Fermé'}</button></div>
    </div>
    <div class="card">
      <label class="f">Mode « rush » : délai de préparation supplémentaire
        <select id="sRush">${[0,10,15,20,30,45,60].map((m) => `<option value="${m}" ${m === s.rushMinutes ? 'selected' : ''}>${m ? '+' + m + ' min' : 'Aucun'}</option>`).join('')}</select></label>
      <label class="f">Pizzas maximum par créneau de 15 min (0 = illimité)
        <input id="sMax" type="number" min="0" max="100" value="${s.maxPizzasPerSlot}"></label>
      <p><label><input type="checkbox" id="sHalf" ${s.halfAndHalf ? 'checked' : ''}> Proposer « moitié-moitié » (deux pizzas en une, facturée au prix de la plus chère)</label></p>
      <label class="f">Message affiché en haut de l'appli (pizza du moment, promo, congés…)
        <input id="sBanner" maxlength="140" value="${esc(s.banner)}" placeholder="Ex : 🔥 Pizza du moment : Diavola à 11 € !"></label>
      <p class="row"><button class="act" id="sSave">Enregistrer</button><span class="saved" id="sOk"></span></p>
    </div>`;
  $('#fSave').onclick = safe(async () => {
    const id = $('#fItem').value;
    const priceTxt = $('#fPrice').value.trim();
    const price = priceTxt === '' ? null : toCents(priceTxt);
    if (price !== null && isNaN(price)) return alert('Prix promo invalide');
    await api('/settings', { method: 'PUT', body: id
      ? { featuredItemId: Number(id), featuredPriceCents: price, featuredUntil: $('#fUntil').value, featuredNote: $('#fNote').value }
      : { featuredItemId: null } });
    $('#fOk').textContent = '✓ Enregistré';
  });
  $('#sOpen').onclick = safe(async () => { await api('/settings', { method: 'PUT', body: { ordersOpen: !s.ordersOpen } }); loadSettings(); });
  $('#sSave').onclick = safe(async () => {
    await api('/settings', { method: 'PUT', body: { rushMinutes: +$('#sRush').value, maxPizzasPerSlot: +$('#sMax').value, banner: $('#sBanner').value, halfAndHalf: $('#sHalf').checked } });
    $('#sOk').textContent = '✓ Enregistré';
  });
}

/* ---------- Carte ---------- */
const sizesToText = (sizes) => JSON.parse(sizes || '[]').map((s) => `${s.label}=${(s.extra_cents / 100).toFixed(2).replace('.', ',')}`).join('; ');
const textToSizes = (t) => t.split(';').map((p) => p.trim()).filter(Boolean).map((p) => {
  const [label, price] = p.split('=');
  return { label: (label || '').trim(), extra_cents: price ? toCents(price) : 0 };
});

function itemCard(i) {
  return `<details class="card ${i.available ? '' : 'off'}" data-item="${i.id}">
    <summary class="row">
      ${i.image_url ? `<img class="thumb" src="${esc(i.image_url)}" alt="">` : '<div class="thumb"></div>'}
      <div class="grow"><b>${esc(i.name)}</b> <span class="muted">${esc(i.category)} · ${KINDS[i.kind]}</span><br><span class="muted">${esc(i.description)}</span></div>
      <b>${euro(i.price_cents)}</b><span class="muted">${i.available ? '' : '(masqué)'} ✎</span>
    </summary>
    <label class="f">Nom<input data-f="name" value="${esc(i.name)}"></label>
    <div class="row"><label class="f grow">Catégorie<input data-f="category" value="${esc(i.category)}"></label>
      <label class="f">Type<select data-f="kind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${k === i.kind ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="f">Prix €<input data-f="price" size="6" inputmode="decimal" value="${(i.price_cents / 100).toFixed(2)}"></label></div>
    <label class="f">Description<input data-f="description" value="${esc(i.description)}"></label>
    <label class="f">Ingrédients (séparés par des virgules — le client peut en retirer, pizzas uniquement)<input data-f="ingredients" value="${esc(i.ingredients)}"></label>
    <label class="f">Allergènes (ex : gluten, lait, œufs)<input data-f="allergens" value="${esc(i.allergens)}"></label>
    <label class="f">Tailles — format « Nom=supplément € ; Nom=supplément € » (pizzas uniquement)<input data-f="sizes" value="${esc(sizesToText(i.sizes))}"></label>
    <p><label><input type="checkbox" data-f="vegetarian" ${i.vegetarian ? 'checked' : ''}> Végétarien</label>
       &nbsp; <label><input type="checkbox" data-f="available" ${i.available ? 'checked' : ''}> Disponible</label></p>
    <div class="row"><button class="act" data-save>Enregistrer</button>
      <label class="act sm" style="cursor:pointer">📷 Photo<input type="file" accept="image/*" data-photo hidden></label>
      ${i.image_url ? '<button class="act red sm" data-rmphoto>Retirer la photo</button>' : ''}</div>
  </details>`;
}

function resizeToJpeg(file, max = 800) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => reject(new Error('Image illisible'));
    img.src = URL.createObjectURL(file);
  });
}

async function loadMenu() {
  const { items, supplements, combos } = await api('/menu');
  const open = new Set([...document.querySelectorAll('#menu details[open]')].map((d) => d.dataset.item || d.dataset.sup || d.dataset.combo));
  const cats = [...new Set(items.map((i) => i.category))];
  $('#menu').innerHTML = `
    <h3>Articles</h3>
    <div class="card"><b>Ajouter un article</b><div class="row" style="margin-top:8px">
      <input id="nCat" placeholder="Catégorie (Pizzas…)" list="cats"><input id="nName" placeholder="Nom" class="grow">
      <select id="nKind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <input id="nPrice" placeholder="Prix €" size="6" inputmode="decimal"><button class="act" id="nAdd">Ajouter</button></div>
      <datalist id="cats">${cats.map((c) => `<option value="${esc(c)}">`).join('')}</datalist></div>
    ${items.map(itemCard).join('')}
    <h3>Suppléments (pizzas)</h3>
    ${supplements.map((s) => `<div class="card row ${s.available ? '' : 'off'}" data-sup="${s.id}">
      <input data-f="name" class="grow" value="${esc(s.name)}"><input data-f="price" size="6" inputmode="decimal" value="${(s.price_cents / 100).toFixed(2)}">
      <label><input type="checkbox" data-f="available" ${s.available ? 'checked' : ''}> actif</label><button class="act sm" data-savesup>OK</button></div>`).join('')}
    <div class="card row"><input id="sName" class="grow" placeholder="Nouveau supplément"><input id="sPrice" size="6" placeholder="Prix €" inputmode="decimal"><button class="act sm" id="sAdd">Ajouter</button></div>
    <h3>Formules</h3>
    <p class="muted">Composition : liste de types séparés par des virgules (pizza, boisson, dessert, autre). Le client choisit un article de chaque type. Ex. « Pizza Duo » : une seule case « pizza » (la demi-pizza), la salade est dans le nom de la formule.</p>
    ${combos.map((c) => `<div class="card ${c.available ? '' : 'off'}" data-combo="${c.id}">
      <div class="row"><input data-f="name" class="grow" value="${esc(c.name)}"><input data-f="price" size="6" inputmode="decimal" value="${(c.price_cents / 100).toFixed(2)}"></div>
      <div class="row" style="margin-top:8px"><input data-f="description" class="grow" value="${esc(c.description)}"><input data-f="slots" value="${esc(c.slots.join(', '))}">
      <label><input type="checkbox" data-f="available" ${c.available ? 'checked' : ''}> active</label><button class="act sm" data-savecombo>OK</button></div></div>`).join('')}
    <div class="card"><b>Nouvelle formule</b><div class="row" style="margin-top:8px"><input id="cName" class="grow" placeholder="Nom"><input id="cSlots" placeholder="pizza, boisson" value="pizza, boisson"><input id="cPrice" size="6" placeholder="Prix €" inputmode="decimal"><button class="act sm" id="cAdd">Ajouter</button></div></div>`;
  document.querySelectorAll('#menu details').forEach((d) => { d.open = open.has(d.dataset.item); });

  $('#nAdd').onclick = safe(async () => {
    const priceCents = toCents($('#nPrice').value);
    if (!$('#nName').value || !$('#nCat').value || isNaN(priceCents)) return alert('Catégorie, nom et prix requis');
    await api('/menu', { method: 'POST', body: { category: $('#nCat').value, name: $('#nName').value, kind: $('#nKind').value, priceCents } });
    loadMenu();
  });
  $('#sAdd').onclick = safe(async () => {
    const priceCents = toCents($('#sPrice').value);
    if (!$('#sName').value || isNaN(priceCents)) return alert('Nom et prix requis');
    await api('/supplements', { method: 'POST', body: { name: $('#sName').value, priceCents } }); loadMenu();
  });
  $('#cAdd').onclick = safe(async () => {
    const priceCents = toCents($('#cPrice').value);
    const slots = $('#cSlots').value.split(',').map((s) => s.trim()).filter(Boolean);
    if (!$('#cName').value || isNaN(priceCents)) return alert('Nom et prix requis');
    await api('/combos', { method: 'POST', body: { name: $('#cName').value, priceCents, slots } }); loadMenu();
  });

  const val = (root, f) => { const el = root.querySelector(`[data-f="${f}"]`); return el.type === 'checkbox' ? el.checked : el.value; };
  document.querySelectorAll('[data-item]').forEach((el) => {
    const id = el.dataset.item;
    el.querySelector('[data-save]').onclick = safe(async () => {
      const priceCents = toCents(val(el, 'price'));
      if (isNaN(priceCents)) return alert('Prix invalide');
      await api('/menu/' + id, { method: 'PATCH', body: {
        name: val(el, 'name'), category: val(el, 'category'), kind: val(el, 'kind'), description: val(el, 'description'),
        ingredients: val(el, 'ingredients'), allergens: val(el, 'allergens'), vegetarian: val(el, 'vegetarian'),
        available: val(el, 'available'), sizes: textToSizes(val(el, 'sizes')), priceCents } });
      loadMenu();
    });
    el.querySelector('[data-photo]').onchange = safe(async (e) => {
      if (!e.target.files[0]) return;
      await api(`/menu/${id}/image`, { method: 'PUT', body: { dataUrl: await resizeToJpeg(e.target.files[0]) } });
      loadMenu();
    });
    const rm = el.querySelector('[data-rmphoto]');
    if (rm) rm.onclick = safe(async () => { await api(`/menu/${id}/image`, { method: 'PUT', body: { dataUrl: null } }); loadMenu(); });
  });
  document.querySelectorAll('[data-sup]').forEach((el) => {
    el.querySelector('[data-savesup]').onclick = safe(async () => {
      const priceCents = toCents(val(el, 'price'));
      if (isNaN(priceCents)) return alert('Prix invalide');
      await api('/supplements/' + el.dataset.sup, { method: 'PATCH', body: { name: val(el, 'name'), priceCents, available: val(el, 'available') } }); loadMenu();
    });
  });
  document.querySelectorAll('[data-combo]').forEach((el) => {
    el.querySelector('[data-savecombo]').onclick = safe(async () => {
      const priceCents = toCents(val(el, 'price'));
      if (isNaN(priceCents)) return alert('Prix invalide');
      const slots = val(el, 'slots').split(',').map((s) => s.trim()).filter(Boolean);
      await api('/combos/' + el.dataset.combo, { method: 'PATCH', body: { name: val(el, 'name'), description: val(el, 'description'), priceCents, slots, available: val(el, 'available') } }); loadMenu();
    });
  });
}

/* ---------- Navigation ---------- */
function show() {
  $('#login').hidden = true; $('#nav').hidden = false;
  for (const t of TABS) $('#' + t).hidden = tab !== t;
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
}
const TABS = ['orders', 'stats', 'clients', 'menu', 'settings'];
const loaders = { orders: loadOrders, stats: loadStats, clients: loadClients, menu: loadMenu, settings: loadSettings };
// Seules les commandes se rafraîchissent seules : on ne touche pas aux formulaires en cours d'édition.
async function refresh(force = false) {
  try {
    if (tab === 'orders' || force) await loaders[tab]();
    show();
  } catch (e) {
    if (!e.auth) return console.error(e);
    clearInterval(timer); sessionStorage.removeItem('adminToken');
    $('#nav').hidden = true; for (const t of TABS) $('#' + t).hidden = true;
    $('#login').hidden = false;
    $('#loginErr').textContent = e.status === 503 ? "Le serveur n'a pas de code d'accès configuré." : 'Code incorrect.';
  }
}
function start() { clearInterval(timer); first = true; refresh(true); timer = setInterval(refresh, 5000); }

$('#go').onclick = () => { token = $('#token').value; sessionStorage.setItem('adminToken', token); start(); };
$('#token').onkeydown = (e) => e.key === 'Enter' && $('#go').click();
$('#nav').onclick = (e) => { if (e.target.dataset.tab) { tab = e.target.dataset.tab; refresh(true); } };
$('#orders').onclick = safe(async (e) => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  if (b.dataset.status === 'cancelled' && !confirm('Annuler cette commande ?')) return;
  await api(`/orders/${b.dataset.id}/status`, { method: 'PATCH', body: { status: b.dataset.status } }); refresh();
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/admin' }).catch(() => {});
if (token) start(); else $('#login').hidden = false;
</script>
</body>
